name: Workbench Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: workbench-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate generated model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Test Workbench
        run: |
          npm test --workspace=@earendil-works/workbench-runtime
          npm test --workspace=@earendil-works/workbench-core
          npm test --workspace=@earendil-works/workbench-database
          npm test --workspace=@earendil-works/workbench-mcp
          npm test --workspace=@earendil-works/workbench-runtime-pi
          npm test --workspace=@earendil-works/workbench-server
          npm test --workspace=@earendil-works/workbench-ui

      - name: Check browser tests
        run: npm run check:e2e --workspace=@earendil-works/workbench-ui

      - name: Install test browser
        run: npx playwright install chromium

      - name: Browser acceptance
        env:
          WORKBENCH_BROWSER_CHANNEL: chromium
        run: npm run test:e2e --workspace=@earendil-works/workbench-ui
